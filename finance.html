        if (editing) $('biDel').addEventListener('click', () => {
          if (!confirm('Delete ' + s.name + '?')) return;
          const arr = subs(); arr.splice(i, 1); S.set('subs', arr);
          closeSheet(); afterChange();
        });
      });
  }

  // ---------- wishlist item ----------
  function sheetWishAdd() {
    let kind = 'wish';
    openSheet('Add to wishlist',
      '<div class="field"><div class="seg" id="wkKind"><button type="button" data-v="wish" class="on">Saving for it</button><button type="button" data-v="order">Already ordered</button></div></div>'
      + '<label class="field"><span>What is it?</span><input class="inp" id="wName" placeholder="e.g. New headphones"></label>'
      + '<label class="field"><span>Price (€)</span><input class="inp num" id="wAmt" inputmode="decimal" placeholder="0"></label>'
      + '<div id="wWishOnly"><label class="field"><span>Already saved (€) — optional</span><input class="inp num" id="wSaved" inputmode="decimal" placeholder="0"></label></div>'
      + '<div id="wOrderOnly" hidden><label class="field"><span>Arrives</span><input class="inp" type="date" id="wDate"></label>'
      + '<label class="field"><span>Paid from</span><select class="inp" id="wFrom">' + accountOptions('', 'Not paid yet') + '</select></label></div>'
      + '<button class="btn primary" type="button" id="wSave">Add</button>',
      (root) => {
        wireChips(root, '#wkKind button', (v) => { kind = v; $('wWishOnly').hidden = v !== 'wish'; $('wOrderOnly').hidden = v !== 'order'; });
        setTimeout(() => $('wName').focus(), 250);
        $('wSave').addEventListener('click', () => {
          const name = $('wName').value.trim(), amount = parseNum($('wAmt').value);
          if (!name) { $('wName').focus(); return; }
          if (!(amount >= 0)) { $('wAmt').focus(); return; }
          if (kind === 'wish') {
            const arr = wishes(); const saved = parseNum($('wSaved').value);
            arr.push(Object.assign({ name, amount, ts: Date.now() }, saved > 0 ? { saved } : {}));
            S.set('wishlist', arr);
          } else {
            addOrder(name, amount, $('wDate').value || null, splitAccount($('wFrom').value));
          }
          closeSheet(); afterChange();
        });
      });
  }
  function addOrder(name, amount, date, acc) {
    const arr = orders();
    const o = { id: 'o_' + Date.now() + '_' + Math.floor(Math.random() * 9999), name, amount, fromCat: acc ? acc.cat : 'bank', fromAccount: acc ? acc.name : null, date, ts: Date.now(), deductedAt: null, pctAtDeduction: null, deductedFrom: null };
    arr.push(o); S.set('incoming_orders', arr);
    if (acc) payOrder(o.id, acc.cat, acc.name);
    return o;
  }
  function sheetWish(i) {
    const w = wishes()[i]; if (!w) return;
    const price = Number(w.amount) || 0, have = Number(w.saved) || 0;
    openSheet(w.name,
      '<div class="sheet-hero"><div class="amt num">' + money(have, true) + ' <span class="muted" style="font-size:18px">of ' + money(price, true) + '</span></div>'
      + '<div class="bar" style="margin:12px 0 0"><div class="bar-fill" style="width:' + (price ? Math.min(100, have / price * 100) : 0).toFixed(1) + '%;background:#9085e9"></div></div></div>'
      + '<label class="field"><span>Put money aside (€) — use −20 to take some back</span><input class="inp num" id="wsAdd" inputmode="decimal" placeholder="e.g. 50"></label>'
      + '<label class="field"><span>Name</span><input class="inp" id="wsName" value="' + esc(w.name) + '"></label>'
      + '<label class="field"><span>Price (€)</span><input class="inp num" id="wsAmt" inputmode="decimal" value="' + price + '"></label>'
      + '<button class="btn primary" type="button" id="wsSave">Save</button>'
      + '<div class="btn-row"><button class="btn danger" type="button" id="wsDel">' + ico('trash', 16) + 'Delete</button><button class="btn" type="button" id="wsBuy">' + ico('package', 16) + 'I bought it</button></div>',
      () => {
        $('wsSave').addEventListener('click', () => {
          const arr = wishes(), x = arr[i]; if (!x) return;
          const add = parseNum($('wsAdd').value.replace('−', '-'));
          x.name = $('wsName').value.trim() || x.name;
          const p = parseNum($('wsAmt').value); if (p >= 0) x.amount = p;
          if (isFinite(add)) x.saved = Math.max(0, round2((Number(x.saved) || 0) + add));
          S.set('wishlist', arr); closeSheet(); afterChange();
        });
        $('wsDel').addEventListener('click', () => {
          if (!confirm('Remove ' + w.name + ' from your wishlist?')) return;
          const arr = wishes(); arr.splice(i, 1); S.set('wishlist', arr); closeSheet(); afterChange();
        });
        $('wsBuy').addEventListener('click', () => sheetBuy(i));
      });
  }
  // Wish → order on its way (optionally paid from an account right away).
  function sheetBuy(i) {
    const w = wishes()[i]; if (!w) return;
    openSheet('Bought ' + w.name,
      '<label class="field"><span>Price paid (€)</span><input class="inp num" id="byAmt" inputmode="decimal" value="' + (Number(w.amount) || 0) + '"></label>'
      + '<label class="field"><span>Arrives</span><input class="inp" type="date" id="byDate"></label>'
      + '<label class="field"><span>Paid from</span><select class="inp" id="byFrom">' + accountOptions('', 'Don\'t touch my accounts') + '</select></label>'
      + '<button class="btn primary" type="button" id="bySave">Move to On the way</button>',
      () => {
        $('bySave').addEventListener('click', () => {
          const amount = parseNum($('byAmt').value);
          addOrder(w.name, isFinite(amount) ? amount : Number(w.amount) || 0, $('byDate').value || null, splitAccount($('byFrom').value));
          const arr = wishes(); arr.splice(i, 1); S.set('wishlist', arr);
          closeSheet(); afterChange(); toast('On the way');
        });
      });
  }
  function sheetOrder(id) {
    const o = orders().find((x) => x.id === id); if (!o) return;
    const paid = !!o.deductedAt;
    openSheet(o.name,
      '<div class="sheet-hero"><span class="av" style="width:56px;height:56px;margin:0 auto 10px;background:rgba(144,133,233,0.16);color:#9085e9">' + ico('package', 26) + '</span><div class="amt num">' + money(o.amount) + '</div>'
      + '<div class="muted" style="font-size:12.5px;margin-top:4px">' + (paid ? 'Paid from ' + esc((o.deductedFrom && o.deductedFrom.name) || '') + ' · ' + dayLabel(o.deductedAt).toLowerCase() : 'Not paid from an account yet') + '</div></div>'
      + '<label class="field"><span>Arrives</span><input class="inp" type="date" id="orDate" value="' + esc(o.date || '') + '"></label>'
      + (paid ? '' : '<div class="field"><span>Pay it from</span><div class="pick">' + (accounts().map((a) => '<button type="button" data-pay="' + esc(a.cat + '::' + a.name) + '"><span>' + esc(a.name) + '</span><small class="num">' + money(a.amount, true) + (a.amount < (Number(o.amount) || 0) ? ' · not enough' : '') + '</small></button>').join('') || '<div class="muted">Add an account on the Money tab first.</div>') + '</div></div>')
      + '<button class="btn primary" type="button" id="orDone">' + ico('check', 16) + 'It arrived — remove</button>'
      + '<div class="btn-row">' + (paid ? '<button class="btn" type="button" id="orUndo">Undo payment</button>' : '<button class="btn" type="button" id="orSave">Save date</button>')
      + '<button class="btn danger" type="button" id="orDel">' + ico('trash', 16) + 'Delete</button></div>'
      + '<p class="note" style="margin:12px 0 0;text-align:center">Delete undoes nothing; use Undo payment first to put the money back.</p>',
      (root) => {
        const saveDate = () => { const arr = orders(), x = arr.find((y) => y.id === id); if (x) { x.date = $('orDate').value || null; S.set('incoming_orders', arr); } };
        root.querySelectorAll('[data-pay]').forEach((b) => b.addEventListener('click', () => {
          const acc = splitAccount(b.dataset.pay);
          saveDate(); payOrder(id, acc.cat, acc.name); closeSheet(); afterChange(); toast('Paid from ' + acc.name);
        }));
        const rm = () => { S.set('incoming_orders', orders().filter((x) => x.id !== id)); };
        $('orDone').addEventListener('click', () => { rm(); closeSheet(); afterChange(); toast('Enjoy it'); });
        $('orDel').addEventListener('click', () => { if (!confirm('Delete ' + o.name + '?')) return; rm(); closeSheet(); afterChange(); });
        if (paid) $('orUndo').addEventListener('click', () => { saveDate(); unpayOrder(id); closeSheet(); afterChange(); });
        else $('orSave').addEventListener('click', () => { saveDate(); closeSheet(); afterChange(); });
      });
  }

  // ============================================================
  // Render + events
  // ============================================================
  function renderAll() {
    if (!W()) return;
    processAutoPay();
    try { renderHome(); } catch (e) { console.error(e); }
    try { renderInsights(); } catch (e) { console.error(e); }
    try { renderBills(); } catch (e) { console.error(e); }
    try { renderWish(); } catch (e) { console.error(e); }
    renderHeaderSub();
  }

  const ACTIONS = { expense: sheetExpense, account: () => sheetAccount(null), budget: () => sheetBudget(), bill: () => sheetBill(null), wish: sheetWishAdd };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-act]');
    if (!t) return;
    if (t.id === 'reviewBtn') { runReview(); return; }
    if (t.dataset.act && ACTIONS[t.dataset.act]) { ACTIONS[t.dataset.act](); return; }
    if (t.dataset.tx) return sheetTx(t.dataset.tx);
    if (t.dataset.acct) return sheetAccount(t.dataset.acct);
    if (t.dataset.bill != null && t.dataset.bill !== '') return sheetBill(Number(t.dataset.bill));
    if (t.dataset.wish != null && t.dataset.wish !== '') return sheetWish(Number(t.dataset.wish));
    if (t.dataset.order) return sheetOrder(t.dataset.order);
    if (t.dataset.cat) return sheetBudget(t.dataset.cat === 'Unsorted' ? null : t.dataset.cat);
    if (t.dataset.tab) return setView(t.dataset.tab);
  });

  // New merchants → one Gemini call → categories saved per merchant.
  function sortSpending(res) {
    const n = W().uncategorized(res).length;
    if (!n) return;
    spendStatus = { text: '✨ E.F.I. is sorting ' + n + ' new merchant' + (n === 1 ? '' : 's') + '…', err: false };
    renderTx();
    W().categorize(res).then((r) => {
      spendStatus = r.ok ? { text: '', err: false } : { text: r.error, err: true };
      renderAll();
    });
  }
  let walletStarted = false;
  function loadWallet(force) {
    W().get(force).then((res) => { renderAll(); if (syncReady) sortSpending(res); });
    if (walletStarted) return;
    walletStarted = true;
    W().subscribe((res) => { renderAll(); sortSpending(res); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWallet(true); });
  }

  // Once this device has the latest finance row: auto-pay bills, sort merchants.
  window.__financeSyncReady = function () {
    if (syncReady) return;
    syncReady = true;
    if (W()) { renderAll(); loadWallet(true); }
  };

  function boot() {
    $('addBtn').innerHTML = ico('plus', 20, 2.4);
    $('mPrev').innerHTML = ico('chevronLeft', 18);
    $('mNext').innerHTML = ico('chevronRight', 18);
    $('sheetClose').innerHTML = ico('x', 16);
    $('qExpense').innerHTML = ico('plus', 16) + 'Expense';
    $('qAccount').innerHTML = ico('wallet', 16) + 'Account';
    $('qBudget').innerHTML = ico('activity', 16) + 'Budget';
    document.querySelectorAll('#tabs [data-i]').forEach((s) => { s.outerHTML = ico(s.dataset.i, 16, 2); });
    $('addBtn').addEventListener('click', () => ACTIONS[VIEWS[view].add]());
    $('txMore').addEventListener('click', () => { txShown += 30; renderTx(); });
    $('mPrev').addEventListener('click', () => { monthOffset = Math.max(-12, monthOffset - 1); renderInsights(); });
    $('mNext').addEventListener('click', () => { monthOffset = Math.min(0, monthOffset + 1); renderInsights(); });
    $('sheetClose').addEventListener('click', closeSheet);
    $('syncLine').addEventListener('click', sheetSyncLog);
    setInterval(() => { if (view === 'bills' && !document.hidden) renderSyncLine(); }, 1500);
    $('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    setView(view);
    if (!W()) { console.error('wallet.js did not load'); return; }
    renderAll();
    loadWallet(false);
    // Cloud sync (or E.F.I. in another tab) changed the data — repaint.
    window.addEventListener('storage', () => renderAll());
  }
  // No timer fallback: CloudSync.init resolves offline too (after its retries).
  // Auto-pay must never run on data that might be stale while a pull is still
  // on its way — its writes would win, and a bill could be paid twice.
  document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const ready = function () { if (window.__financeSyncReady) window.__financeSyncReady(); };
  if (!window.CloudSync) { ready(); return; }
  window.CloudSync.init('finance', {
    onApplied: function () { window.dispatchEvent(new Event('storage')); }
  }).then(ready);
});
</script>

</body>
