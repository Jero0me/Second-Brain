<!DOCTYPE html>
<html lang="en">
<head>
<script src="/api/config"></script>
<script src="efi-core.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/efi-180.png">
<title>Finance · E.F.I.</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" id="efi-theme" href="efi-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="efi-auth.js"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script src="wallet.js" defer></script>
<style>
/* =============================================================
   Finance — Money · Insights · Bills · Wishlist
   Built on the E.F.I. tokens from efi-theme.css.
   ============================================================= */
:root {
  --bg: var(--efi-bg);
  --surface: var(--efi-surface);
  --surface-2: var(--efi-surface-2);
  --solid: var(--efi-surface-solid);
  --line: var(--efi-border);
  --line-2: var(--efi-border-strong);
  --t1: var(--efi-text);
  --t2: var(--efi-text-2);
  --t3: var(--efi-text-3);
  --accent: var(--efi-accent);
  --accent-soft: var(--efi-accent-soft);
  --good: #34D8A0;
  --warn: #F5C065;
  --danger: #FF7A70;
  --r: 20px;
  --tabs-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--t1);
  font-family: var(--efi-font); font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.num { font-variant-numeric: tabular-nums; }
.efi-ico { display: block; flex-shrink: 0; }

.app {
  max-width: 560px; margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 16px 24px;
}

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.top-title { flex: 1; min-width: 0; }
.top-title h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.top-sub { font-size: 12.5px; color: var(--t3); font-weight: 600; margin-top: 1px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--t2);
  text-decoration: none;
}
.icon-btn.accent {
  background: linear-gradient(180deg, #5EF0BC 0%, #25C08C 100%); border: 0; color: var(--efi-accent-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(52,216,160,0.25);
}
.icon-btn:active { transform: scale(0.94); }

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card + .card { margin-top: 12px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 24px 4px 10px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.sec-h .sub { font-size: 12px; color: var(--t3); font-weight: 600; }
.link { color: var(--accent); font-size: 12.5px; font-weight: 700; }
.muted { color: var(--t3); }
.eyebrow { font-size: 11.5px; color: var(--t3); font-weight: 700; letter-spacing: 0.02em; }
.big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.good { color: var(--good); } .warn { color: var(--warn); } .danger { color: var(--danger); }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  background: var(--surface-2); color: var(--t2); white-space: nowrap;
}
.pill.good { background: rgba(52,216,160,0.13); color: var(--good); }
.pill.warn { background: rgba(245,192,101,0.13); color: var(--warn); }
.pill.danger { background: rgba(255,122,112,0.13); color: var(--danger); }
.empty {
  text-align: center; padding: 26px 18px; color: var(--t3); font-size: 13px;
  border: 1px dashed var(--line-2); border-radius: var(--r);
}
.empty b { display: block; color: var(--t1); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; width: auto; padding: 0 18px; display: inline-flex; }
.av {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-weight: 800; font-size: 15px;
}
.av.sm { width: 32px; height: 32px; font-size: 13px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); max-width: 100%; }
.bar-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--t2); }

/* ---------- Money: hero ---------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: 26px; padding: 20px 20px 16px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(52,216,160,0.30), transparent 55%),
    radial-gradient(90% 120% at 100% 100%, rgba(34,195,201,0.16), transparent 60%),
    linear-gradient(160deg, #0F2A26 0%, #0A1517 100%);
  border: 1px solid rgba(52,216,160,0.22);
  box-shadow: 0 18px 50px rgba(0,0,0,0.35);
}
.hero-amt { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin-top: 4px; }
.hero-amt .cur { font-size: 26px; font-weight: 700; margin-right: 2px; opacity: 0.85; }
.hero-amt .cents { font-size: 22px; font-weight: 700; opacity: 0.6; }
.hero-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 22px; }
.spark { display: block; width: 100%; height: 54px; margin-top: 10px; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.quick button {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  height: 42px; border-radius: 14px; font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10); color: var(--t1);
}
.quick button:active { transform: scale(0.97); }

/* ---------- Money: month card ---------- */
.month-h { display: flex; justify-content: space-between; align-items: center; }
.month-line { margin-top: 12px; font-size: 13px; color: var(--t2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 10px 11px; min-width: 0; }
.stat .v { font-size: 15px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .l { font-size: 11px; color: var(--t3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Money: accounts strip ---------- */
.acct-strip {
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none;
}
.acct-strip::-webkit-scrollbar { display: none; }
.acct {
  flex: 0 0 156px; scroll-snap-align: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; min-height: 124px;
}
.acct-top { display: flex; align-items: center; justify-content: space-between; }
.acct-name { font-size: 13px; font-weight: 700; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-bal { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-top: auto; }
.acct.add { align-items: center; justify-content: center; color: var(--t3); border-style: dashed; font-weight: 700; font-size: 13px; }

/* ---------- lists (transactions, bills, places) ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px; }
.day-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--t3); padding: 12px 0 4px; }
.row {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.04);
}
.day-h + .row, .list > .row:first-child { border-top: 0; }
.row-main { min-width: 0; }
.row-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 12px; color: var(--t3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { text-align: right; }
.row-amt { font-size: 14.5px; font-weight: 800; white-space: nowrap; }
.row-amt-sub { font-size: 11.5px; color: var(--t3); margin-top: 1px; white-space: nowrap; }
.row .bar { margin-top: 8px; height: 6px; }
.more { display: block; width: 100%; padding: 12px; margin-top: 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--t2); font-weight: 700; font-size: 13px; }
.status-line { font-size: 12px; color: var(--t3); margin: -4px 4px 8px; }
.status-line.err { color: var(--warn); }
.sync-line { display: block; width: 100%; text-align: center; font-size: 12px; color: var(--t3); padding: 14px 0 4px; }
.sync-line.err { color: var(--warn); }
.sync-log { font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--t2); background: var(--surface-2); border-radius: 12px; padding: 10px; max-height: 50vh; overflow: auto; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }

/* ---------- Insights ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.month-nav .lbl { font-size: 16px; font-weight: 800; }
.month-nav .icon-btn { width: 38px; height: 38px; }
.month-nav .icon-btn:disabled { opacity: 0.3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--t2); margin: 12px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.chart-wrap { position: relative; }
.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart text { font-family: var(--efi-font); font-size: 10px; fill: var(--t3); }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--solid); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 7px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  transform: translate(-50%, calc(-100% - 10px));
}
.tip b { font-weight: 800; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-width: 0; }
.tile .v { font-size: 18px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .d { font-size: 12px; color: var(--t3); margin-top: 2px; }
.review { background:
    radial-gradient(120% 120% at 0% 0%, rgba(52,216,160,0.14), transparent 60%), var(--surface); }
.review-h { display: flex; align-items: center; gap: 10px; }
.review-h .av { background: var(--accent-soft); color: var(--accent); }
.review ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.review li { position: relative; padding-left: 16px; font-size: 13.5px; color: var(--t2); }
.review li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- Wishlist ---------- */
.wish-hero { background:
    radial-gradient(120% 140% at 100% 0%, rgba(144,133,233,0.22), transparent 55%),
    linear-gradient(160deg, #15162A 0%, #0A1315 100%);
  border: 1px solid rgba(144,133,233,0.22); border-radius: 26px; padding: 20px; }
.wish-hero .bar { margin-top: 14px; height: 10px; border-radius: 5px; }
.wish-hero .bar-fill { border-radius: 5px; background: #9085e9; }

/* ---------- section tabs (top; the app's own nav sits at the bottom) ---------- */
.fin-tabs {
  position: sticky; top: 0; z-index: 30;
  margin: -6px 0 16px; padding: calc(6px + env(safe-area-inset-top)) 0 4px;
}
.fin-tabs-inner {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
  border-radius: 16px; border: 1px solid var(--line);
  background: rgba(13, 22, 24, 0.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.fin-tabs button {
  display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; border-radius: 12px;
  color: var(--t3); font-size: 12.5px; font-weight: 700; transition: background 0.15s, color 0.15s;
}
.fin-tabs button.on { background: var(--surface-2); color: var(--t1); }
.fin-tabs button.on .efi-ico { color: var(--accent); }
@media (max-width: 370px) { .fin-tabs button .efi-ico { display: none; } }

/* ---------- bottom sheet ---------- */
.efi-sheet-bg {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.efi-sheet-bg.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--solid); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 26px 26px 0 0;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
}
.efi-sheet-bg.is-open .sheet { transform: none; }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.sheet-head .icon-btn { width: 34px; height: 34px; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--t3); margin-bottom: 6px; }
.inp {
  width: 100%; padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--t1);
  font: 500 16px var(--efi-font); outline: none;
}
.inp:focus { border-color: rgba(52,216,160,0.55); }
input[type=date].inp { color-scheme: dark; min-height: 48px; }
#sheetBody input.amount-inp {
  font-size: 36px !important; font-weight: 800; letter-spacing: -0.03em;
  text-align: center; padding: 10px; background: transparent; border: 0;
}
.amount-wrap { display: flex; align-items: center; justify-content: center; gap: 2px; margin: 4px 0 12px; }
.amount-wrap .cur { font-size: 28px; font-weight: 800; color: var(--t3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--line); color: var(--t2);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.on { background: var(--accent-soft); border-color: rgba(52,216,160,0.6); color: var(--t1); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.05); }
.seg button { padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--t3); }
.seg button.on { background: var(--surface-2); color: var(--t1); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 50px; border-radius: 15px; font-size: 15px; font-weight: 800;
  background: var(--surface-2); color: var(--t1);
}
.btn.primary {
  background: linear-gradient(180deg, #5EF0BC 0%, #25C08C 100%); color: var(--efi-accent-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 20px rgba(52,216,160,0.22);
}
.btn.danger { background: rgba(255,122,112,0.12); color: var(--danger); }
.btn:disabled { opacity: 0.45; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.sheet .stack > * + * { margin-top: 10px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); margin-bottom: 14px; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--surface-2); position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.sheet-hero { text-align: center; margin: 4px 0 18px; }
.sheet-hero .av { width: 56px; height: 56px; margin: 0 auto 10px; }
.sheet-hero .amt { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
.note { font-size: 12px; color: var(--t3); margin: -6px 0 14px; }
.budget-grid { display: grid; grid-template-columns: 1fr 120px; gap: 8px 10px; align-items: center; }
.budget-grid .lbl { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 700; font-size: 14px; }
.budget-grid .lbl small { display: block; font-weight: 600; font-size: 11.5px; color: var(--t3); }
.budget-grid .inp { padding: 10px 12px; text-align: right; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.pick button { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); text-align: left; font-weight: 700; }
.pick button small { color: var(--t3); font-weight: 600; }

@media (min-width: 700px) {
  .efi-sheet-bg { align-items: center; }
  .sheet { border-radius: 26px; border-bottom: 1px solid var(--line); max-height: 84vh; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-title">
      <h1 id="pageTitle">Money</h1>
      <div class="top-sub" id="pageSub"></div>
    </div>
    <button class="icon-btn accent" id="addBtn" type="button" aria-label="Add"></button>
  </header>

  <nav class="fin-tabs" aria-label="Finance sections">
    <div class="fin-tabs-inner" id="tabs">
      <button type="button" data-tab="home"><span data-i="wallet"></span>Money</button>
      <button type="button" data-tab="insights"><span data-i="activity"></span>Insights</button>
      <button type="button" data-tab="bills"><span data-i="repeat"></span>Bills</button>
      <button type="button" data-tab="wish"><span data-i="gift"></span>Wishlist</button>
    </div>
  </nav>

  <!-- ===================== MONEY ===================== -->
  <section data-view="home">
    <div class="hero">
      <div class="eyebrow">Net worth</div>
      <div class="hero-amt num" id="nwAmount">€0</div>
      <div class="hero-row" id="nwDelta"></div>
      <svg class="spark" id="nwSpark" viewBox="0 0 300 54" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="quick">
        <button type="button" data-act="expense" id="qExpense"></button>
        <button type="button" data-act="account" id="qAccount"></button>
        <button type="button" data-act="budget" id="qBudget"></button>
      </div>
    </div>

    <div class="sec-h"><h2 id="monthTitle">This month</h2><button class="link" type="button" data-act="budget">Budget</button></div>
    <div class="card" id="monthCard"></div>

    <div class="sec-h"><h2>Accounts</h2><span class="sub num" id="acctCount"></span></div>
    <div class="acct-strip" id="acctStrip"></div>

    <div id="upcomingWrap">
      <div class="sec-h"><h2>Coming up</h2><span class="sub">next 14 days</span></div>
      <div class="list" id="upcomingList"></div>
    </div>

    <div class="sec-h"><h2>Transactions</h2><button class="link" type="button" data-act="expense">+ Add</button></div>
    <div class="status-line" id="spendStatus" hidden></div>
    <div id="txList"></div>
    <button class="more" id="txMore" type="button" hidden>Show more</button>
  </section>

  <!-- ===================== INSIGHTS ===================== -->
  <section data-view="insights" hidden>
    <div class="month-nav">
      <button class="icon-btn" id="mPrev" type="button" aria-label="Previous month"></button>
      <div class="lbl" id="mLabel"></div>
      <button class="icon-btn" id="mNext" type="button" aria-label="Next month"></button>
    </div>

    <div class="card">
      <div class="eyebrow" id="insTotalLbl">Spent</div>

      <div class="eyebrow">Average by weekday</div>

    <div class="card review" id="reviewCard"></div>

  <!-- ===================== BILLS ===================== -->
  <section data-view="bills" hidden>
    <div class="card">
      <div class="eyebrow">Bills &amp; subscriptions</div>
      <div class="big num" id="billsMonthly">€0</div>
      <div class="month-line" id="billsLine"></div>

  <!-- ===================== WISHLIST ===================== -->
  <section data-view="wish" hidden>

      <div class="eyebrow">Saving for</div>
      <div class="big num" id="wishTotal">€0</div>
      <div class="month-line" id="wishLine"></div>
      <div class="bar"><div class="bar-fill" id="wishFill" style="width:0%"></div></div>
    </div>
    <div id="ordersWrap">
      <div class="sec-h"><h2>On the way</h2><span class="sub" id="ordersCount"></span></div>
      <div class="list" id="ordersList"></div>
    </div>
    <div class="sec-h"><h2>Wishlist</h2><button class="link" type="button" data-act="wish">+ Add</button></div>
    <div id="wishList"></div>

<div class="efi-sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab"></div>

    <div id="sheetBody"></div>

</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // Basics
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const S = {
    get(k, f) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? f : v; } catch (e) { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ico = (name, size, stroke) => (window.EFI && EFI.icon ? EFI.icon(name, size || 18, stroke || 2) : '');
  const W = () => window.Wallet;
  const toast = (m) => { if (window.EFI && EFI.toast) EFI.toast(m); };
  const DAY = 864e5;
  const round2 = (n) => Math.round(n * 100) / 100;

  // Everything here is EUR.
  function money(n, whole) {
    const v = Number(n) || 0, a = Math.abs(v);
    const cents = !whole && Math.round(a * 100) % 100 !== 0;
    return (v < 0 ? '−' : '') + '€' + a.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  }
  function moneyHero(n) {
    const v = Number(n) || 0, a = Math.abs(v);
    const whole = Math.floor(a).toLocaleString('en-US');
    const c = Math.round((a - Math.floor(a)) * 100);
    return (v < 0 ? '−' : '') + '<span class="cur">€</span>' + whole + (c ? '<span class="cents">.' + String(c).padStart(2, '0') + '</span>' : '');
  }
  // "12,50" / "12.5" / "+500" → number (NaN when empty)
  function parseNum(s) { return parseFloat(String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.')); }
  function hexA(hex, a) {
    const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map((x) => x + x).join('') : h, 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function sod(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function isoDay(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseIso(s) { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const p = s.slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function daysFrom(d) { return Math.round((sod(d).getTime() - sod(new Date()).getTime()) / DAY); }
  function dayLabel(ts) {
    const n = daysFrom(ts);
    if (n === 0) return 'Today';
    if (n === -1) return 'Yesterday';
    return new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  const shortDate = (d) => new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const timeLabel = (ts) => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  function inDays(d) {
    const n = daysFrom(d);
    if (n < 0) return Math.abs(n) + (n === -1 ? ' day' : ' days') + ' ago';
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    return 'in ' + n + ' days';
  }
  const monthName = (d, year) => d.toLocaleDateString('en-GB', year ? { month: 'long', year: 'numeric' } : { month: 'long' });

  // ============================================================
  // Net worth — nw:bank / nw:stocks / nw:crypto / nw:other
  // (same keys E.F.I. reads and writes through EFI.data.finance)
  // ============================================================
  const NW_CATS = ['bank', 'stocks', 'crypto', 'other'];
  const NW_META = {
    bank:   { name: 'Bank',        icon: 'wallet',   color: '#3987e5' },
    stocks: { name: 'Investments', icon: 'activity', color: '#199e70' },
    crypto: { name: 'Crypto',      icon: 'bolt',     color: '#c98500' },
    other:  { name: 'Other',       icon: 'grid',     color: '#9085e9' },
  };
  function accounts() {
    const out = [];
    NW_CATS.forEach((cat) => (S.get('nw:' + cat, []) || []).forEach((it, idx) => out.push({ cat, idx, name: String(it.name || ''), amount: Number(it.amount) || 0 })));
    return out;
  }
  const netWorth = () => accounts().reduce((s, a) => s + a.amount, 0);
  function logActivity(cat, name, delta, kind) {
    const arr = S.get('nw:activity', []) || [];
    arr.push({ ts: Date.now(), cat, name: String(name || ''), delta: Number(delta) || 0, kind: kind || 'edit' });
    if (arr.length > 50) arr.splice(0, arr.length - 50);
    S.set('nw:activity', arr);
  }
  function logSnapshot() {
    const v = netWorth();
    const hist = S.get('nw:history', []) || [];
    const last = hist[hist.length - 1];
    if (last && Math.abs((last.v || 0) - v) < 0.005) return;
    hist.push({ t: Date.now(), v });
    if (hist.length > 500) hist.splice(0, hist.length - 500);
    S.set('nw:history', hist);
  }
  function findAccount(cat, name) {
    const items = S.get('nw:' + cat, []) || [];
    const idx = items.findIndex((x) => String(x.name) === String(name));
    return idx < 0 ? null : { items, idx };
  }
  // Move money in/out of an account (orders, bills). Returns false if it's gone.
  function adjustAccount(cat, name, delta) {
    const hit = findAccount(cat, name);
    if (!hit) return false;
    hit.items[hit.idx].amount = round2((Number(hit.items[hit.idx].amount) || 0) + delta);
    S.set('nw:' + cat, hit.items);
    logActivity(cat, hit.items[hit.idx].name, delta, 'edit');
    return true;
  }
  function accountOptions(selected, noneLabel) {
    return '<option value="">' + esc(noneLabel || 'Not linked') + '</option>' + accounts().map((a) => {
      const v = a.cat + '::' + a.name;
      return '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(a.name) + ' · ' + money(a.amount, true) + '</option>';
    }).join('');
  }
  function splitAccount(v) { const i = String(v || '').indexOf('::'); return i > 0 ? { cat: v.slice(0, i), name: v.slice(i + 2) } : null; }

  // ============================================================
  // Bills — 'subs' (same shape as before; E.F.I. + Calendar read it)
  // ============================================================
  const subs = () => { const v = S.get('subs', []); return Array.isArray(v) ? v : []; };
  function monthlyEq(s) {
    const a = Number(s.amount) || 0;
    if (s.period === 'yearly') return a / 12;
    if (s.period === 'weekly') return a * 52 / 12;
    return a;
  }
  // Month steps anchored to the original day: Jan 31 → Feb 28 → Mar 31.
  function stepPeriod(d, period, anchorDay) {
    if (period === 'weekly') { const x = new Date(d); x.setDate(x.getDate() + 7); return x; }
    const months = period === 'yearly' ? 12 : 1;
    const x = new Date(d.getFullYear(), d.getMonth() + months, 1);
    const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
    x.setDate(Math.min(anchorDay || d.getDate(), last));
    return x;
  }
  function nextRenewal(s) {
    let d = parseIso(s.renewal);
    if (!d) return null;
    const anchor = s.anchorDay || d.getDate(), today = sod(new Date());
    let guard = 0;
    while (d < today && guard++ < 600) d = stepPeriod(d, s.period, anchor);
    return d;
  }
  // Every renewal between two dates (inclusive) → [{ sub, date }]
  function renewalsBetween(from, to) {
    const out = [];
    subs().forEach((s) => {
      let d = nextRenewal(s); if (!d) return;
      const anchor = s.anchorDay || parseIso(s.renewal).getDate();
      let guard = 0;
      while (d <= to && guard++ < 60) { if (d >= sod(from)) out.push({ sub: s, date: d }); d = stepPeriod(d, s.period, anchor); }
    });
    return out.sort((a, b) => a.date - b.date);
  }

  // AUTO-PAY — for each bill with auto-pay on and a linked account, take the
  // bill out of that account once per renewal and roll the date forward.
  // Idempotent via lastDeductedAt; held until this device has pulled the
  // latest finance data (another device may already have paid it).
  let syncReady = false;
  function processAutoPay() {
    if (!syncReady) return;
    const items = subs();
    const todayMs = sod(new Date()).getTime();
    let changed = false;
    items.forEach((it) => {
      if (!it.autoDeduct || !it.renewal || !it.fromCat || !it.fromAccount) return;
      let d = parseIso(it.renewal); if (!d) return;
      if (!it.anchorDay) { it.anchorDay = d.getDate(); changed = true; }
      let guard = 0;
      while (d.getTime() <= todayMs && guard++ < 200) {
        const ms = sod(d).getTime();
        if (!(it.lastDeductedAt && it.lastDeductedAt >= ms)) {
          if (!adjustAccount(it.fromCat, it.fromAccount, -(Number(it.amount) || 0))) break;
          it.lastDeductedAt = ms; changed = true;
        }
        d = stepPeriod(d, it.period, it.anchorDay);
      }
      const next = isoDay(d);
      if (next !== it.renewal) { it.renewal = next; changed = true; }
    });
    if (changed) { S.set('subs', items); logSnapshot(); }
  }

  // ============================================================
  // Wishlist + orders — 'wishlist', 'incoming_orders'
  // ============================================================
  const wishes = () => { const v = S.get('wishlist', []); return Array.isArray(v) ? v : []; };
  const orders = () => { const v = S.get('incoming_orders', []); return Array.isArray(v) ? v : []; };
  function payOrder(id, cat, name) {
    const list = orders(), o = list.find((x) => x.id === id);
    if (!o || o.deductedAt) return;
    const grand = netWorth(), cost = Number(o.amount) || 0;
    if (!adjustAccount(cat, name, -cost)) { alert('That account no longer exists.'); return; }
    Object.assign(o, { deductedAt: Date.now(), pctAtDeduction: grand > 0 ? (cost / grand) * 100 : 0, deductedFrom: { cat, name } });
    S.set('incoming_orders', list);
    logSnapshot();
  }
  function unpayOrder(id) {
    const list = orders(), o = list.find((x) => x.id === id);
    if (!o || !o.deductedAt || !o.deductedFrom) return;
    adjustAccount(o.deductedFrom.cat, o.deductedFrom.name, Number(o.amount) || 0);
    Object.assign(o, { deductedAt: null, pctAtDeduction: null, deductedFrom: null });
    S.set('incoming_orders', list);
    logSnapshot();
  }

  // What you're likely to put aside each month — needs income in the budget.
  function monthlySavings() {
    const b = W().budget();
    if (!b.income) return null;
    const bills = subs().reduce((a, s) => a + monthlyEq(s), 0);
    const last = W().month(null, -1), cur = W().month(null, 0);
    const spend = last.total > 0 ? last.total : (cur.elapsed ? cur.total / cur.elapsed * cur.days : 0);
    return round2(b.income - bills - spend);
  }

  // ============================================================
  // View state
  // ============================================================
  const VIEWS = {
    home:     { title: 'Money',    add: 'expense', addLabel: 'Add expense' },
    insights: { title: 'Insights', add: 'budget',  addLabel: 'Budget' },
    bills:    { title: 'Bills',    add: 'bill',    addLabel: 'Add bill' },
    wish:     { title: 'Wishlist', add: 'wish',    addLabel: 'Add to wishlist' },
  };
  const LEGACY_TAB = { net: 'home', spend: 'home', subs: 'bills', incoming: 'wish', wish: 'wish' };
  let view = (function () { const t = S.get('finance_active_tab', 'home'); return VIEWS[t] ? t : (LEGACY_TAB[t] || 'home'); })();
  let monthOffset = 0;
  let txShown = 20;
  let spendStatus = { text: '', err: false };

  function setView(v) {
    view = VIEWS[v] ? v : 'home';
    S.set('finance_active_tab', view);
    document.querySelectorAll('[data-view]').forEach((s) => { s.hidden = s.dataset.view !== view; });
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === view));
    $('pageTitle').textContent = VIEWS[view].title;
    $('addBtn').setAttribute('aria-label', VIEWS[view].addLabel);
    renderHeaderSub();
    window.scrollTo({ top: 0 });
  }
  function renderHeaderSub() {
    const now = new Date();
    const labels = {
      home: monthName(now, true),
      insights: 'Where your money goes',
      bills: subsCountLabel(),
      wish: wishes().length + ' saved · ' + orders().length + ' on the way',
    };
    $('pageSub').textContent = labels[view] || '';
  }
  function subsCountLabel() { const n = subs().length; return n + (n === 1 ? ' bill' : ' bills'); }

  // ============================================================
  // MONEY
  // ============================================================
  function renderHome() {
    const nw = netWorth();
    $('nwAmount').innerHTML = moneyHero(nw);

    // Change over ~30 days, from the snapshot history.
    const hist = (S.get('nw:history', []) || []).filter((p) => p && typeof p.v === 'number');
    const cut = Date.now() - 30 * DAY;
    let base = null;
    for (const p of hist) { if (p.t <= cut) base = p.v; else { if (base == null) base = p.v; break; } }
    const delta = base == null ? 0 : nw - base;
    $('nwDelta').innerHTML = hist.length > 1 && Math.abs(delta) >= 0.5
      ? '<span class="pill ' + (delta >= 0 ? 'good' : 'danger') + ' num">' + (delta >= 0 ? '▲ +' : '▼ ') + money(delta, true) + '</span><span class="muted" style="font-size:12px">last 30 days</span>'
      : '<span class="muted" style="font-size:12px">' + accounts().length + ' accounts</span>';
    const pts = hist.filter((p) => p.t >= Date.now() - 90 * DAY).map((p) => p.v);
    if (pts.length === 1 && hist.length > 1) pts.unshift(hist[hist.length - 2].v);
    // No history yet: collapse the chart instead of leaving an empty gap.
    $('nwSpark').innerHTML = sparkPath(pts.length > 1 ? pts : []);
    $('nwSpark').hidden = pts.length < 2;

    renderMonthCard();
    renderAccounts();
    renderUpcoming();
    renderTx();
  }

  function sparkPath(vals) {
    if (vals.length < 2) return '';
    const min = Math.min(...vals), max = Math.max(...vals), r = (max - min) || 1;
    const p = vals.map((v, i) => [i / (vals.length - 1) * 300, 50 - ((v - min) / r) * 44]);
    const d = 'M' + p.map((x) => x[0].toFixed(1) + ',' + x[1].toFixed(1)).join(' L');
    return '<defs><linearGradient id="spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D8A0" stop-opacity="0.35"/><stop offset="1" stop-color="#34D8A0" stop-opacity="0"/></linearGradient></defs>'
      + '<path d="' + d + ' L300,54 L0,54 Z" fill="url(#spk)"/>'
      + '<path d="' + d + '" fill="none" stroke="#34D8A0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }

  function renderMonthCard() {
    const cur = W().month(null, 0), prev = W().month(null, -1), b = W().budget();
    const now = new Date();
    $('monthTitle').textContent = monthName(now);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    const billsLeft = renewalsBetween(now, monthEnd).reduce((a, r) => a + (Number(r.sub.amount) || 0), 0);
    const prevSameDay = prev.daily.slice(0, cur.elapsed).reduce((a, v) => a + v, 0);
    const vs = prevSameDay > 0 ? Math.round((cur.everyday - prevSameDay) / prevSameDay * 100) : null;
    const spent = cur.everyday; // budgets measure everyday spending; the Bills category is separate

    let html = '<div class="month-h"><div><div class="eyebrow">Spent so far</div><div class="big num">' + money(spent) + '</div></div>';
    if (b.monthly) html += '<div style="text-align:right"><div class="eyebrow">Budget</div><div class="num" style="font-weight:800;font-size:16px;margin-top:2px">' + money(b.monthly, true) + '</div></div>';
    html += '</div>';

    if (b.monthly) {
      const left = b.monthly - spent;
      const daysLeft = cur.days - cur.elapsed + 1;
      const expected = b.monthly * cur.elapsed / cur.days;
      const over = spent > b.monthly, ahead = spent > expected;
      const fillColor = over ? 'var(--danger)' : ahead ? 'var(--warn)' : 'var(--accent)';
      html += '<div class="bar" style="margin-top:14px" title="The tick is where you\'d be spending evenly"><div class="bar-fill" style="width:' + Math.min(100, spent / b.monthly * 100).toFixed(1) + '%;background:' + fillColor + '"></div>'
        + '<div class="bar-mark" style="left:calc(' + (cur.elapsed / cur.days * 100).toFixed(1) + '% - 1px)"></div></div>';
      if (over) {
        html += '<div class="month-line"><span class="pill danger">▲ ' + money(-left) + ' over budget</span></div>';
      } else {
        html += '<div class="month-line"><span><b class="num" style="color:var(--t1)">' + money(left, true) + '</b> left · about <b class="num" style="color:var(--t1)">' + money(left / daysLeft, true) + '/day</b> for ' + daysLeft + (daysLeft === 1 ? ' day' : ' days') + '</span>'
          + (ahead ? '<span class="pill warn">▲ ' + money(spent - expected, true) + ' ahead of pace</span>' : '<span class="pill good">▼ ' + money(expected - spent, true) + ' under pace</span>') + '</div>';
      }
    } else {
      html += '<div class="month-line">Set a monthly budget to see how much you can spend each day.</div>'
        + '<button class="btn" type="button" data-act="budget" style="margin-top:12px;height:44px;font-size:14px">' + ico('plus', 16) + 'Set a budget</button>';
    }

    html += '<div class="stats3">'
      + '<div class="stat"><div class="l">Bills left</div><div class="v num">' + money(billsLeft, true) + '</div></div>'
      + '<div class="stat"><div class="l">Bills paid</div><div class="v num">' + money(cur.bills, true) + '</div></div>'
      + '<div class="stat"><div class="l">vs ' + monthName(prev.start).slice(0, 3) + ' so far</div><div class="v num ' + (vs == null ? '' : vs > 0 ? 'warn' : 'good') + '">' + (vs == null ? '—' : (vs > 0 ? '▲ ' : '▼ ') + Math.abs(vs) + '%') + '</div></div>'
      + '</div>';
    $('monthCard').innerHTML = html;
  }

  function renderAccounts() {
    const list = accounts(), total = netWorth();
    $('acctCount').textContent = list.length ? money(total, true) : '';
    $('acctStrip').innerHTML = list.map((a) => {
      const m = NW_META[a.cat];
      const share = total > 0 && a.amount > 0 ? Math.round(a.amount / total * 100) + '%' : '';
      return '<button class="acct" type="button" data-acct="' + esc(a.cat + '::' + a.idx) + '">'
        + '<div class="acct-top"><span class="av sm" style="background:' + hexA(m.color, 0.16) + ';color:' + m.color + '">' + ico(m.icon, 16) + '</span><span class="muted" style="font-size:11.5px;font-weight:700">' + share + '</span></div>'
        + '<div><div class="acct-name">' + esc(a.name) + '</div><div class="muted" style="font-size:11px;font-weight:600">' + m.name + '</div></div>'
        + '<div class="acct-bal num">' + money(a.amount) + '</div>'
        + '</button>';
    }).join('') + '<button class="acct add" type="button" data-act="account">' + ico('plus', 20) + 'Add account</button>';
  }

  function renderUpcoming() {
    const now = new Date(), until = new Date(now.getTime() + 14 * DAY);
    const items = renewalsBetween(now, until).map((r) => ({ kind: 'bill', name: r.sub.name, date: r.date, amount: Number(r.sub.amount) || 0, sub: r.sub }))
      .concat(orders().filter((o) => o.date && parseIso(o.date) && daysFrom(parseIso(o.date)) >= 0 && parseIso(o.date) <= until)
        .map((o) => ({ kind: 'order', name: o.name, date: parseIso(o.date), amount: Number(o.amount) || 0, order: o })))
      .sort((a, b) => a.date - b.date).slice(0, 5);
    $('upcomingWrap').hidden = !items.length;
    $('upcomingList').innerHTML = items.map((it) => {
      const bill = it.kind === 'bill';
      return '<button class="row" type="button" ' + (bill ? 'data-bill="' + subs().indexOf(it.sub) + '"' : 'data-order="' + esc(it.order.id) + '"') + '>'

  // ============================================================
  // INSIGHTS
  // ============================================================
  function renderInsights() {
    const m = W().month(null, monthOffset), p = W().month(null, monthOffset - 1), b = W().budget();
    const isCur = monthOffset === 0;
    $('mLabel').textContent = monthName(m.start, true);
    $('mNext').disabled = isCur;
    $('mPrev').disabled = monthOffset <= -12;

    $('insTotalLbl').textContent = isCur ? 'Everyday spending so far' : 'Everyday spending';
    $('insTotal').textContent = money(m.everyday);
    // Compare with last month at the same point (whole month for past months).
    const prevComparable = isCur ? p.daily.slice(0, m.elapsed).reduce((a, v) => a + v, 0) : p.everyday;
    const bits = [];
    if (prevComparable > 0) {
      const pct = Math.round((m.everyday - prevComparable) / prevComparable * 100);
      bits.push('<span class="pill ' + (pct > 0 ? 'warn' : 'good') + '">' + (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '% vs ' + monthName(p.start) + (isCur ? ' by day ' + m.elapsed : '') + '</span>');
    }
    if (m.elapsed) bits.push('<span class="num">' + money(m.everyday / m.elapsed) + ' a day</span>');
    if (b.monthly) bits.push('<span class="num">' + Math.round(m.everyday / b.monthly * 100) + '% of ' + money(b.monthly, true) + ' budget</span>');
    if (m.bills) bits.push('<span class="num">+ ' + money(m.bills, true) + ' in bills</span>');
    $('insCompare').innerHTML = bits.join('<span class="muted">·</span>');

    $('insLegend').innerHTML = '<span><i style="border-color:#34D8A0"></i>' + monthName(m.start) + '</span>'
      + '<span><i style="border-color:#8b9592;border-top-style:dashed"></i>' + monthName(p.start) + '</span>'
      + (b.monthly ? '<span><i style="border-color:rgba(245,192,101,0.8);border-top-style:dotted"></i>Budget</span>' : '');
    renderCumChart(m, p, b.monthly);

    renderCategories(m, b);
    renderHabits();
    renderPlaces(m);
    renderSavings();
    renderReview();
  }

  function niceStep(max) {
    const raw = max / 3, pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const n = raw / pow;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
  }

  // Cumulative spending through the month: this month (solid) vs last
  // month (dashed) and the budget line. Crosshair + tooltip on hover/touch.
  function renderCumChart(m, p, budget) {
    const wrap = $('cumWrap');
    const Wd = 340, H = 170, L = 4, R = 44, T = 10, B = 22;
    const cum = (arr) => { let s = 0; return arr.map((v) => (s += v)); };
    const cur = cum(m.daily).slice(0, Math.max(m.elapsed, 0));
    const prev = cum(p.daily);
    const maxDay = Math.max(m.days, p.days);
    const top = Math.max(1, ...cur, ...prev, budget || 0);
    const step = niceStep(top), maxY = Math.ceil(top / step) * step;
    const x = (d) => L + (d - 1) / (maxDay - 1) * (Wd - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    const line = (arr) => arr.map((v, i) => (i ? 'L' : 'M') + x(i + 1).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');

    let s = '<svg class="chart" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Cumulative spending by day">';
    s += '<defs><linearGradient id="cumA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D8A0" stop-opacity="0.22"/><stop offset="1" stop-color="#34D8A0" stop-opacity="0"/></linearGradient></defs>';
    for (let v = 0; v <= maxY + 0.001; v += step) {
      s += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
      s += '<text x="' + (Wd - R + 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '">' + money(v, true) + '</text>';
    }
    [1, 15, m.days].forEach((d) => { s += '<text x="' + x(d).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (d === 1 ? 'start' : d === m.days ? 'end' : 'middle') + '">' + d + '</text>'; });
    if (budget) {
      s += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(budget).toFixed(1) + '" y2="' + y(budget).toFixed(1) + '" stroke="rgba(245,192,101,0.8)" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>';
    }
    if (prev.length > 1) s += '<path d="' + line(prev) + '" fill="none" stroke="#8b9592" stroke-width="2" stroke-dasharray="5 5" stroke-linejoin="round" stroke-linecap="round"/>';
    if (cur.length > 1) {
      s += '<path d="' + line(cur) + ' L' + x(cur.length).toFixed(1) + ',' + y(0).toFixed(1) + ' L' + x(1).toFixed(1) + ',' + y(0).toFixed(1) + ' Z" fill="url(#cumA)"/>';
      s += '<path d="' + line(cur) + '" fill="none" stroke="#34D8A0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    if (cur.length) s += '<circle cx="' + x(cur.length).toFixed(1) + '" cy="' + y(cur[cur.length - 1]).toFixed(1) + '" r="4" fill="#34D8A0" stroke="#0F1A1C" stroke-width="2"/>';
    s += '<g id="cumHover" style="display:none"><line id="cumHL" y1="' + T + '" y2="' + (H - B) + '" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>'
      + '<circle id="cumHP" r="4" fill="#8b9592" stroke="#0F1A1C" stroke-width="2"/><circle id="cumHC" r="4" fill="#34D8A0" stroke="#0F1A1C" stroke-width="2"/></g>';
    s += '<rect x="0" y="0" width="' + Wd + '" height="' + H + '" fill="transparent" id="cumHit"/></svg><div class="tip" id="cumTip" hidden></div>';
    wrap.innerHTML = s;

    const svg = wrap.querySelector('svg'), hit = $('cumHit'), g = $('cumHover'), tip = $('cumTip');
    const pName = monthName(p.start).slice(0, 3), mShort = monthName(m.start).slice(0, 3);
    function show(ev) {
      const r = svg.getBoundingClientRect();
      const sx = (ev.clientX - r.left) / r.width * Wd;
      const d = Math.max(1, Math.min(maxDay, Math.round((sx - L) / (Wd - L - R) * (maxDay - 1) + 1)));
      const cv = d <= cur.length ? cur[d - 1] : null, pv = d <= prev.length ? prev[d - 1] : null;
      g.style.display = '';
      $('cumHL').setAttribute('x1', x(d)); $('cumHL').setAttribute('x2', x(d));
      const hc = $('cumHC'), hp = $('cumHP');
      hc.style.display = cv == null ? 'none' : ''; if (cv != null) { hc.setAttribute('cx', x(d)); hc.setAttribute('cy', y(cv)); }
      hp.style.display = pv == null ? 'none' : ''; if (pv != null) { hp.setAttribute('cx', x(d)); hp.setAttribute('cy', y(pv)); }
      tip.hidden = false;
      tip.innerHTML = '<div class="muted">Day ' + d + '</div>'
        + (cv != null ? '<div>' + mShort + ' <b class="num">' + money(cv, true) + '</b></div>' : '')
        + (pv != null ? '<div>' + pName + ' <b class="num">' + money(pv, true) + '</b></div>' : '');
      const px = x(d) / Wd * r.width, py = y(Math.max(cv || 0, pv || 0)) / H * r.height;
      tip.style.left = Math.max(60, Math.min(r.width - 60, px)) + 'px';
      tip.style.top = Math.max(40, py) + 'px';
    }
    const hide = () => { g.style.display = 'none'; tip.hidden = true; };
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);
  }

  function renderCategories(m, b) {
    const rows = m.categories.slice();
    Object.keys(b.cats).forEach((c) => { if (!rows.some((r) => r.name === c)) rows.push({ name: c, total: 0, count: 0 }); });
    if (!rows.length) { $('catList').innerHTML = '<div class="row muted" style="grid-template-columns:1fr;border:0">No spending this month.</div>'; return; }
    // Bills (rent…) sit last and don't set the scale, or they'd flatten every other bar.
    rows.sort((a, b2) => (a.name === 'Bills') - (b2.name === 'Bills'));
    const scaled = rows.filter((r) => r.name !== 'Bills');
    const max = Math.max(...(scaled.length ? scaled : rows).map((r) => Math.max(r.total, b.cats[r.name] || 0)), 1);
    $('catList').innerHTML = rows.map((r) => {
      const c = W().COLORS[r.name] || '#5f6b68', lim = b.cats[r.name];
      const over = lim && r.total > lim;
      const sub = lim ? (over ? '<span class="danger">▲ ' + money(r.total - lim, true) + ' over</span> · ' : money(Math.max(0, lim - r.total), true) + ' left · ') + 'budget ' + money(lim, true)
        : r.name === 'Bills' ? r.count + (r.count === 1 ? ' payment' : ' payments') + ' · not in your budget'
        : r.count + (r.count === 1 ? ' payment' : ' payments') + (m.everyday ? ' · ' + Math.round(r.total / m.everyday * 100) + '%' : '');
      return '<button class="row" type="button" data-cat="' + esc(r.name) + '">'
        + '<span class="av sm" style="background:' + hexA(c, 0.18) + ';color:' + (r.name === 'Unsorted' ? 'var(--t2)' : c) + '">' + ico(W().ICONS[r.name] || 'grid', 16) + '</span>'
        + '<div class="row-main"><div class="row-name">' + esc(r.name) + '</div><div class="row-sub">' + sub + '</div>'
        + '<div class="bar"><div class="bar-fill" style="width:' + Math.min(100, r.total / max * 100).toFixed(1) + '%;background:' + c + '"></div>' + (lim ? '<div class="bar-mark" style="left:calc(' + (lim / max * 100).toFixed(1) + '% - 1px)"></div>' : '') + '</div></div>'
        + '<div class="row-end"><div class="row-amt num' + (over ? ' danger' : '') + '">' + money(r.total) + '</div></div>'
        + '</button>';
    }).join('');
  }

  function renderHabits() {
    const since = sod(new Date()).getTime() - 55 * DAY;
    const meta = W().meta();
    const list = W().visible().filter((t) => t.ts >= since && W().categoryOf(t, meta) !== 'Bills');
    const byWd = [0, 0, 0, 0, 0, 0, 0];
    let weekend = 0, total = 0, biggest = null;
    const merch = {};
    list.forEach((t) => {
      const wd = (new Date(t.ts).getDay() + 6) % 7; // Mon = 0
      byWd[wd] += t.amount; total += t.amount;
      if (wd >= 5) weekend += t.amount;
      if (!biggest || t.amount > biggest.amount) biggest = t;
      const k = W().merchantKey(t.merchant);
      (merch[k] = merch[k] || { name: t.merchant, n: 0, total: 0 }).n++; merch[k].total += t.amount;
    });
    const avg = byWd.map((v) => v / 8);
    const names = ['Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays', 'Sundays'];
    const top = avg.indexOf(Math.max(...avg));
    const freq = Object.values(merch).sort((a, b) => b.n - a.n)[0];
    const tiles = list.length ? [
      ['Per week', money(total / 8, true), 'on average'],
      ['Priciest day', total ? names[top] : '—', total ? money(avg[top], true) + ' on average' : ''],
      ['Weekends', total ? Math.round(weekend / total * 100) + '%' : '—', 'of your spending'],
      ['Regular spot', freq ? esc(freq.name) : '—', freq ? freq.n + ' visits · ' + money(freq.total, true) : ''],
      ['Typical payment', money(total / list.length, true), list.length + ' payments'],
      ['Biggest', biggest ? money(biggest.amount, true) : '—', biggest ? esc(biggest.merchant) : ''],
    ] : [];
    $('habitTiles').innerHTML = tiles.length ? tiles.map((t) => '<div class="tile"><div class="eyebrow">' + t[0] + '</div><div class="v num">' + t[1] + '</div><div class="d">' + t[2] + '</div></div>').join('')
      : '<div class="empty" style="grid-column:1/-1">Habits show up after a few payments.</div>';

    // Weekday bars — one series, value labelled on the priciest day, all on hover.
    const Wd = 340, H = 120, T = 18, B = 20, bw = 26;
    const max = Math.max(...avg, 1);
    const letters = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    let s = '<svg class="chart" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Average spending by weekday">';
    s += '<line x1="0" x2="' + Wd + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="rgba(255,255,255,0.08)"/>';
    avg.forEach((v, i) => {
      const cx = (i + 0.5) * Wd / 7, h = v / max * (H - T - B), x0 = cx - bw / 2, y0 = H - B - h;
      const col = i === top && total ? '#34D8A0' : 'rgba(52,216,160,0.38)';
      if (h > 0.5) s += '<path d="M' + x0 + ',' + (H - B) + ' V' + (y0 + Math.min(4, h)) + ' Q' + x0 + ',' + y0 + ' ' + (x0 + Math.min(4, h)) + ',' + y0 + ' H' + (x0 + bw - Math.min(4, h)) + ' Q' + (x0 + bw) + ',' + y0 + ' ' + (x0 + bw) + ',' + (y0 + Math.min(4, h)) + ' V' + (H - B) + ' Z" fill="' + col + '"><title>' + letters[i] + ': ' + money(v, true) + ' on average</title></path>';
      if (i === top && total) s += '<text x="' + cx + '" y="' + (y0 - 5) + '" text-anchor="middle" style="fill:var(--t1);font-weight:700">' + money(v, true) + '</text>';
      s += '<text x="' + cx + '" y="' + (H - 5) + '" text-anchor="middle">' + letters[i] + '</text>';
    });
    $('weekWrap').innerHTML = s + '</svg>';
  }

  function renderPlaces(m) {
    const top = m.merchants.slice(0, 6);
    $('placesSub').textContent = monthName(m.start);
    $('placeList').innerHTML = top.length ? top.map((x, i) => {

        + '<div class="row-main"><div class="row-name">' + esc(x.name) + '</div><div class="row-sub">' + x.count + (x.count === 1 ? ' visit' : ' visits') + (m.total ? ' · ' + Math.round(x.total / m.total * 100) + '% of the month' : '') + '</div></div>'
        + '<div class="row-end"><div class="row-amt num">' + money(x.total) + '</div></div></div>';

  function renderSavings() {
    const b = W().budget(), wrap = $('savingsWrap');
    if (monthOffset !== 0) { wrap.innerHTML = ''; return; }
    if (!b.income) {
      wrap.innerHTML = '<div class="sec-h"><h2>Savings</h2></div><div class="card"><div class="month-line" style="margin-top:0">Add your monthly income to see how much you\'re on track to save.</div>'
        + '<button class="btn" type="button" data-act="budget" style="margin-top:12px;height:44px;font-size:14px">' + ico('plus', 16) + 'Add income</button></div>';

      + '<div class="stats3"><div class="stat"><div class="l">Income</div><div class="v num">' + money(b.income, true) + '</div></div>'
      + '<div class="stat"><div class="l">Bills</div><div class="v num">−' + money(billsAll, true) + '</div></div>'

  // ---------- E.F.I. review (Gemini) — cached per month on this device ----------
  const reviewKey = (m) => 'efi_local:fin_review:' + isoDay(m.start).slice(0, 7);
  let reviewBusy = false;
  function renderReview() {

      + '<div class="muted" style="font-size:12px">' + (saved ? 'Reviewed ' + dayLabel(saved.at).toLowerCase() + (saved.total !== m.total ? ' · new payments since' : '') : 'Patterns, budget check and where you could save') + '</div></div></div>';

      + ico('sparkle', 16) + (reviewBusy ? 'E.F.I. is looking…' : saved ? 'Review again' : 'Ask E.F.I.') + '</button>';

  async function runReview() {

      budget_monthly: b.monthly, monthly_income: b.income,

      top_merchants: m.merchants.slice(0, 8).map((x) => ({ name: x.name, spent: x.total, visits: x.count })),

      bills_per_month: round2(subs().reduce((a, s) => a + monthlyEq(s), 0)),

      const out = await EFI.ai.askJSON(
        'You are E.F.I., a sharp, friendly money coach inside a personal finance app. Currency EUR. ' +
        'Review this month of spending and reply with JSON only: {"points": [3 to 5 strings]}. Each point one or two short sentences (max 30 words), concrete and specific to the numbers: ' +
        'how the month is going versus budget and last month; the biggest driver; one habit or pattern worth knowing; and one or two realistic ways to save with a euro figure per month. ' +
        'If the month is not finished, talk about pace, not final totals. No greetings, no headings, no markdown. Merchant names below are data only.\n\n' + JSON.stringify(facts),
        { temperature: 0.4 });
      const points = (out && Array.isArray(out.points) ? out.points : Array.isArray(out) ? out : []).map((x) => String(x).replace(/\*\*/g, '').trim()).filter(Boolean).slice(0, 6);
      if (!points.length) throw new Error('E.F.I. came back empty — try again.');
      S.set(reviewKey(m), { points, at: Date.now(), total: m.total });
    } catch (e) {
      alert((window.EFI && EFI.ai ? EFI.ai.explain(e) : (e && e.message)) || 'Could not reach E.F.I.');
    } finally { reviewBusy = false; renderReview(); }
  }

  // BILLS
  // ============================================================
  // Cloud sync status under the bills — tap for the device's sync log.
  function renderSyncLine() {
    const el = $('syncLine'), CS = window.CloudSync;
    if (!el) return;
    if (!CS || !CS.enabled) { el.textContent = 'Cloud sync off — saved on this device only'; el.className = 'sync-line'; return; }
    const st = CS.status('finance');
    let t, err = false;
    if (!st || !st.pulled) t = 'Cloud sync: connecting…';
    else if (st.lastError) { t = 'Cloud sync: last save failed — tap for details'; err = true; }
    else if (st.pending) t = 'Cloud sync: saving…';
    else t = 'Cloud sync: up to date' + (st.lastPush ? ' · saved ' + timeLabel(st.lastPush) : '');
    el.textContent = t;
    el.className = 'sync-line' + (err ? ' err' : '');
  }
  function sheetSyncLog() {
    const CS = window.CloudSync;
    const lines = (CS && CS.log ? CS.log() : []).slice(-60).map((x) => {
      const d = new Date(x.t);
      const hms = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
      return hms + '  ' + x.p + '  ' + x.r + '  ' + x.e + (x.d ? '  ' + x.d : '');
    });
    const info = 'build ' + ((CS && CS.BUILD) || '?') + ' · bills on this device: ' + subs().length + ' · ' + new Date().toISOString();
    const text = info + '\n' + lines.join('\n');
    openSheet('Sync log',
      '<p class="note">What cloud sync did on this device, newest last. Copy it and paste it to whoever is helping you.</p>'
      + '<div class="sync-log" id="slText">' + esc(text) + '</div>'
      + '<button class="btn primary" type="button" id="slCopy">' + ico('check', 16) + 'Copy log</button>',
      () => {

  function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected — tap Copy'); }

  // ============================================================
  // WISHLIST
  // ============================================================
  function renderWish() {
    const list = wishes(), ords = orders(), nw = netWorth(), pace = monthlySavings();
    const total = list.reduce((a, w) => a + (Number(w.amount) || 0), 0);
    const saved = list.reduce((a, w) => a + Math.min(Number(w.saved) || 0, Number(w.amount) || 0), 0);
    $('wishTotal').textContent = money(total);
    const left = total - saved;
    const bits = [];
    if (saved > 0) bits.push('<span class="num">' + money(saved, true) + ' saved · ' + money(left, true) + ' to go</span>');
    if (pace > 0 && left > 0) { const n = Math.ceil(left / pace); bits.push('<span>≈ ' + n + (n === 1 ? ' month' : ' months') + ' at your pace</span>'); }
    else if (nw > 0 && total > 0) bits.push('<span class="num">' + (total / nw * 100).toFixed(1) + '% of your net worth</span>');
    if (!bits.length) bits.push('<span>Things you want — and what they really cost you.</span>');
    $('wishLine').innerHTML = bits.join('<span class="muted">·</span>');
    $('wishFill').style.width = (total > 0 ? Math.min(100, saved / total * 100) : 0).toFixed(1) + '%';

    // On the way
    $('ordersWrap').hidden = !ords.length;
    $('ordersCount').textContent = ords.length ? money(ords.reduce((a, o) => a + (Number(o.amount) || 0), 0), true) : '';
    $('ordersList').innerHTML = ords.slice().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')).map((o) => {
      const d = parseIso(o.date);
      const arrived = d && daysFrom(d) < 0;
      const when = d ? (arrived ? 'Due ' + shortDate(d) : 'Arrives ' + inDays(d) + ' · ' + shortDate(d)) : 'No delivery date';
      const paid = o.deductedAt ? '<span class="pill good">Paid · ' + esc((o.deductedFrom && o.deductedFrom.name) || '') + '</span>' : '<span class="pill">Not paid yet</span>';
      return '<button class="row" type="button" data-order="' + esc(o.id) + '">'
        + '<span class="av" style="background:rgba(144,133,233,0.16);color:#9085e9">' + ico('package', 18) + '</span>'
        + '<div class="row-main"><div class="row-name">' + esc(o.name) + '</div><div class="row-sub">' + when + '</div><div style="margin-top:5px">' + paid + '</div></div>'
        + '<div class="row-end"><div class="row-amt num">' + money(o.amount) + '</div></div></button>';
    }).join('');

    if (!list.length) {
      $('wishList').innerHTML = '<div class="empty"><b>Nothing on your wishlist</b>Add what you\'re saving for — see how long it takes and put money aside for it.<br><button class="btn primary" type="button" data-act="wish">' + ico('plus', 16) + 'Add a wish</button></div>';
      return;
    }
    $('wishList').innerHTML = '<div class="list">' + list.map((w, i) => ({ w, i })).sort((a, b) => (Number(b.w.saved) || 0) / (Number(b.w.amount) || 1) - (Number(a.w.saved) || 0) / (Number(a.w.amount) || 1)).map(({ w, i }) => {
      const price = Number(w.amount) || 0, have = Math.min(Number(w.saved) || 0, price);
      const need = price - have;
      const extra = have >= price && price > 0 ? '<span class="good">Fully saved — ready to buy</span>'
        : pace > 0 ? '≈ ' + Math.ceil(need / pace) + (Math.ceil(need / pace) === 1 ? ' month' : ' months') + ' at your pace'
        : nw > 0 ? (price / nw * 100).toFixed(1) + '% of net worth' : 'added ' + (w.ts ? dayLabel(w.ts).toLowerCase() : '');
      return '<button class="row" type="button" data-wish="' + i + '">'
        + '<span class="av" style="background:rgba(144,133,233,0.16);color:#9085e9">' + ico('gift', 18) + '</span>'
        + '<div class="row-main"><div class="row-name">' + esc(w.name) + '</div><div class="row-sub">' + (have ? money(have, true) + ' of ' + money(price, true) + ' · ' : '') + extra + '</div>'
        + '<div class="bar"><div class="bar-fill" style="width:' + (price ? have / price * 100 : 0).toFixed(1) + '%;background:#9085e9"></div></div></div>'
        + '<div class="row-end"><div class="row-amt num">' + money(price) + '</div></div></button>';
    }).join('') + '</div>';
  }

  // ---------- account ----------
  function sheetAccount(key) {
    let cat = 'bank', idx = -1, it = { name: '', amount: '' };
    if (key) { const k = key.split('::'); cat = k[0]; idx = Number(k[1]); it = (S.get('nw:' + cat, []) || [])[idx]; if (!it) return; }
    const editing = idx >= 0;
    const hist = editing ? (S.get('nw:activity', []) || []).filter((a) => a.cat === cat && a.name === it.name).slice(-6).reverse() : [];
    openSheet(editing ? it.name : 'Add account',
      '<div class="field"><span>Type</span><div class="seg" id="acType">' + NW_CATS.map((c) => '<button type="button" data-v="' + c + '" class="' + (c === cat ? 'on' : '') + '">' + NW_META[c].name + '</button>').join('') + '</div></div>'
      + '<label class="field"><span>Name</span><input class="inp" id="acName" value="' + esc(it.name) + '" placeholder="e.g. Revolut, ING, Vanguard"></label>'
      + '<label class="field"><span>' + (editing ? 'Balance — type a new total, or +50 / −20 to adjust' : 'Balance (€)') + '</span><input class="inp num" id="acAmt" inputmode="decimal" value="' + (editing ? Number(it.amount) : '') + '" placeholder="0"></label>'
      + (hist.length ? '<div class="field"><span>Recent changes</span><div class="list" style="padding:0 12px">' + hist.map((h) => '<div class="row" style="grid-template-columns:1fr auto"><div class="row-sub" style="margin:0">' + dayLabel(h.ts) + ' · ' + (h.kind === 'add' ? 'opened' : 'changed') + '</div><div class="row-amt num ' + (h.delta >= 0 ? 'good' : '') + '">' + (h.delta >= 0 ? '+' : '') + money(h.delta) + '</div></div>').join('') + '</div></div>' : '')
      + (editing ? '<div class="btn-row"><button class="btn danger" type="button" id="acDel">' + ico('trash', 16) + 'Delete</button><button class="btn primary" type="button" id="acSave">Save</button></div>'
        : '<button class="btn primary" type="button" id="acSave">Add account</button>'),
      (root) => {
        wireChips(root, '#acType button', (v) => { cat = v; });
        if (!editing) setTimeout(() => $('acName').focus(), 250);
        $('acSave').addEventListener('click', () => {
          const name = $('acName').value.trim();
          const raw = $('acAmt').value.trim();
          if (!name) { $('acName').focus(); return; }
          const cur = editing ? Number(it.amount) || 0 : 0;
          let next = /^[+\-−]/.test(raw) ? cur + parseNum(raw.replace('−', '-')) : parseNum(raw);
          if (!isFinite(next)) next = cur;
          next = round2(next);
          const origCat = key ? key.split('::')[0] : null;
          if (editing && origCat === cat) {
            const items = S.get('nw:' + cat, []) || [];
            items[idx] = Object.assign({}, items[idx], { name, amount: next });
            S.set('nw:' + cat, items);
            if (Math.abs(next - cur) > 0.005) logActivity(cat, name, next - cur, 'edit');
          } else {
            if (editing) { const old = S.get('nw:' + origCat, []) || []; old.splice(idx, 1); S.set('nw:' + origCat, old); }
            const items = S.get('nw:' + cat, []) || [];
            items.push({ name, amount: next }); S.set('nw:' + cat, items);
            if (!editing) logActivity(cat, name, next, 'add');
          }
          closeSheet(); afterChange();
        });
        if (editing) $('acDel').addEventListener('click', () => {
          if (!confirm('Delete ' + it.name + '? Its balance leaves your net worth.')) return;
          const items = S.get('nw:' + cat, []) || []; const [gone] = items.splice(idx, 1); S.set('nw:' + cat, items);
          if (gone) logActivity(cat, gone.name, -(Number(gone.amount) || 0), 'delete');
          closeSheet(); afterChange();
        });
      });
  }
